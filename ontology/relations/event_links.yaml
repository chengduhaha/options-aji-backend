relations:
  event_priced_by_polymarket:
    source: Event
    target: PolymarketContract
    cardinality: "1:N"
    semantic: "Event 在 Polymarket 上被定价"
  event_priced_by_options:
    source: Event
    target: Stock
    cardinality: "1:1"
    semantic: "Event 在期权市场上被定价(通过 IV 隐含)"
  event_affects_stock:
    source: Event
    target: Stock
    cardinality: "1:N"
    metadata: [severity, direction]
  event_has_arbitrage:
    source: Event
    target: CrossMarketArbitrage
    cardinality: "1:1"
    condition: "disagreement > 0.15"
  event_triggers_signal:
    source: Event
    target: Signal
    cardinality: "1:N"
