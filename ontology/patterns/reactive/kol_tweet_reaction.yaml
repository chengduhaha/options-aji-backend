pattern_id: reactive_kol_tweet_reaction
pattern_type: reactive
display_name_zh: KOL 推文实时反应
time_budget_seconds: 30
description_for_llm: |
  当 KOL(Trump/Elon/Cathie Wood 等)发推提到某只股票,
  并伴随价格异动,使用此模板生成期权交易建议。

triggers:
  - condition_type: kol_tweet_with_ticker
    kol_handles: ["@realDonaldTrump", "@elonmusk", "@CathieDWood"]
    price_move_threshold_5min: 0.01

reasoning_chain:
  - step: 1
    action: get_realtime_quote
    input: {ticker: "{trigger.ticker}", window: "5min"}
  - step: 2
    action: get_options_atm_chain
    input: {ticker: "{trigger.ticker}", expiry_within_days: 14}
  - step: 3
    action: classify_tweet_sentiment
    input: {content: "{trigger.tweet_content}"}
  - step: 4
    action: query_historical_kol_pattern
    input: {kol: "{trigger.kol}", ticker: "{trigger.ticker}", lookback_months: 12}
  - step: 5
    action: recommend_options_strike
    input:
      ticker: "{trigger.ticker}"
      direction: "{sentiment.direction}"
      gamma_snapshot: "{step_2.gex_data}"
      historical_pattern: "{step_4.result}"

output_template:
  type: reactive_trade_card
  must_include: [recommended_strike, recommended_expiry, suggested_size, risk_reward]
