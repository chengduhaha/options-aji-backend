object_type: Stock
display_name_zh: 美股标的

attributes:
  ticker:
    type: string
    primary_key: true
  company_name:
    type: string
  sector:
    type: string
  current_price:
    type: float
  iv_rank:
    type: float
    range: [0, 100]
  market_cap:
    type: float

computed:
  volatility_regime:
    type: enum
    values: [low, normal, elevated, extreme]
    rule: |
      iv_rank < 25 -> low
      iv_rank < 60 -> normal
      iv_rank < 85 -> elevated
      else -> extreme
  trend_state:
    type: enum
    values: [uptrend, downtrend, range_bound, consolidating]
