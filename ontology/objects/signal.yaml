object_type: Signal
display_name_zh: 信号

attributes:
  signal_id:
    type: string
    primary_key: true
  signal_type:
    type: enum
    values: [dark_pool, form4, kol_tweet, analyst_note, unusual_options]
  ticker:
    type: string
  direction:
    type: enum
    values: [bullish, bearish, neutral]
  strength:
    type: float
    range: [0, 1]
  source:
    type: string
  timestamp:
    type: datetime
