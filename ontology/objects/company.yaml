object_type: Company
display_name_zh: 公司
description: |
  Company 表示产业星图中的上市或未上市公司实体。上市公司使用 ticker + market
  做主要消歧,未上市公司 ticker 为空,通过中英文名称进入图谱。

attributes:
  company_id:
    type: string
    primary_key: true
  ticker:
    type: string
    nullable: true
    description: "上市代码; 未上市公司为空"
  market:
    type: string
    nullable: true
    description: "开放市场代码,如 US/UK/EU/KR/TW/HK/CN/JP"
  name_zh:
    type: string
  name_en:
    type: string
  sector:
    type: string
  is_listed:
    type: boolean
  logo_url:
    type: string
    nullable: true
  attrs:
    type: json
    description: "market_cap、实时价格、IV 等扩展属性"

bindings:
  stock_detail:
    required: [ticker, market]
  supply_graph:
    required: [company_id, name_zh]
