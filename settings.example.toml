# jwt_expire_hours = 24
# auth_admin_emails = ""

gex_backend_url = ""
gex_backend_headers = ""

xpoz_api_key = ""
xpoz_base_url = "https://api.xpoz.ai/v1"
xpoz_retry_max = 2
xpoz_retry_backoff_seconds = 0.5
xpoz_circuit_breaker_seconds = 120
