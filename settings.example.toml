# 复制本文件为 settings.toml（与 app/ 同级）。settings.toml 已在 .gitignore，勿提交密钥。
# 优先级（从高到低）：进程环境变量 > settings.toml > .env > config.py 中的默认值
#
# 若已与 .env 同时使用：同名键以 settings.toml 为准（.env 中重复项可删掉以免混淆）。

app_name = "OptionsAji Backend"
log_level = "INFO"

# 建议：database_url / redis_url 仅放在 .env，避免本文件中的占位符覆盖真实密码。
# 若全部迁入本文件，请删除 .env 中同名项或确保此处为生产真实值。

massive_api_key = ""
massive_base_url = "https://api.massive.com"
massive_ws_url = "wss://delayed.massive.com/options"

fmp_api_key = ""
fmp_base_url = "https://financialmodelingprep.com/stable"

futu_enabled = true
futu_host = "127.0.0.1"
futu_port = 11111
futu_snapshot_batch_size = 200
futu_cache_ttl_seconds = 3
futu_connect_timeout_seconds = 0.3
# 盘时每 15 分钟将 Futu 期权链写入 options_snapshots（异动 v2）；需 futu-opend 已登录
futu_background_options_sync_enabled = true
# 日 K 线：Futu 数据过期时自动回退 yfinance；设为 false 则完全不用 Futu K 线
futu_daily_klines_enabled = true

# options_snapshots 表清理（每日 3:30 AM ET）
options_snapshot_expired_purge_days = 14
options_snapshot_stale_purge_days = 45

openrouter_api_key = ""
openrouter_base_url = "https://openrouter.ai/api/v1"
model_parse = "deepseek/deepseek-chat"
model_synthesis = "deepseek/deepseek-chat"

xiaomi_api_key = ""
xiaomi_base_url = "https://api.mimo-v2.com/v1"
xiaomi_model = "mimo-v2.5"

discord_bot_token = ""
discord_channel_ids = ""
discord_event_channel_ids = ""
enable_discord_listener = false

sync_watchlist = "SPY,QQQ,AAPL,MSFT,NVDA,TSLA,AMZN,META,GOOGL,AMD"
sync_enabled = true

cors_origins = "https://options-aji.vercel.app,http://localhost:3000"

# ── Stripe billing（兼容/备用） ─────────────────────────────────────────────
stripe_secret_key = ""
stripe_webhook_secret = ""
stripe_price_id_pro = ""
stripe_success_url = "http://localhost:3000/settings?billing=success"
stripe_cancel_url = "http://localhost:3000/settings?billing=cancel"
stripe_portal_return_url = "http://localhost:3000/settings?billing=portal"
free_tier_daily_agent_queries = 20

# ── Creem billing（主商业付费入口） ─────────────────────────────────────────
creem_api_key = ""
creem_api_base_url = "https://api.creem.io"
creem_product_id_pro = ""
creem_success_url = "http://localhost:3000/settings?billing=creem-success"
creem_cancel_url = "http://localhost:3000/settings?billing=creem-cancel"
creem_portal_url = ""
creem_webhook_secret = ""

# ── JWT 用户登录（建议用环境变量 JWT_SECRET_KEY，勿提交真实密钥） ──
